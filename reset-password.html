<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Spatial Vision Tech</title>
  <link rel="stylesheet" href="bim-theme.css">
  <script src="cloudflare-client.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="topbar">
      <details class="page-menu">
        <summary aria-label="Open page navigation"><span class="menu-icon" aria-hidden="true">☰</span></summary>
        <nav class="page-menu-links" aria-label="More pages">
          <a href="certifications.html">Certifications</a>
          <a href="register.html">Register</a>
          <a href="student.html">Student Portal</a>
          <a href="performance.html">Performance &amp; Practice</a>
          <a href="admin.html">Admin Portal</a>
        </nav>
      </details>
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>Spatial Vision Tech</span></a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="index.html#about">Overview</a>
        <a href="services.html">Services</a>
        <a href="index.html#course">Courses</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </div>
  </header>
  <main class="page-shell" style="max-width:560px; padding-top:80px;">
    <section class="portal-card">
      <h1>Set a new password</h1>
      <form id="reset-password-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" id="reset-submit" type="submit">Update password</button>
        <p id="reset-result" role="status" aria-live="polite"></p>
      </form>
      <p>After changing your password, sign in to the appropriate portal:</p>
      <a href="student.html">Student Portal</a>
      <span aria-hidden="true"> · </span>
      <a href="admin.html">Admin Portal</a>
    </section>
  </main>
  <script>
    document.getElementById('reset-password-form').addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      const button = document.getElementById('reset-submit');
      const result = document.getElementById('reset-result');
      if (!new URLSearchParams(location.search).get('token')) {
        result.textContent = 'This reset link is invalid or has expired.';
        return;
      }
      if (password !== confirmation) {
        result.textContent = 'The passwords do not match.';
        return;
      }

      button.disabled = true;
      try {
        const token = new URLSearchParams(location.search).get('token');
        const saltInfo = await svt.request(`/api/auth/reset/salt?token=${encodeURIComponent(token)}`);
        const passwordVerifier = await svt.derivePassword(password, saltInfo);
        const response = await svt.request('/api/auth/reset/confirm', {
          method: 'POST',
          body: JSON.stringify({ token, passwordVerifier })
        });
        result.style.color = response.notificationWarning ? '#8a4b08' : '#2e7d32';
        result.textContent = response.notificationWarning || 'Your password was updated. You can sign in now.';
        event.currentTarget.reset();
      } catch (error) {
        result.style.color = '#c62828';
        result.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
