<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Vision Tech | Admin Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4faf8; color: #1d2d2e; }
    .wrap { max-width: 1200px; margin: 60px auto; background: #fff; padding: 30px; border: 1px solid #dfeae7; box-shadow: 0 12px 28px rgba(0,0,0,.07); }
    .screen { display: none; }
    .screen.active { display: block; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #cddbd7; }
    .btn { display: inline-block; background: #00b482; color: #051a1d; border: none; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    .btn.secondary { background: #0d4a5d; color: #fff; }
    .btn.warn { background: #e67e22; color: #fff; }
    .btn.danger { background: #d64545; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #dfe7eb; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #0b1f25; color: #fff; }
    .status { display: inline-block; padding: 4px 10px; background: #fff3dc; color: #7a4f00; border-radius: 18px; font-size: 12px; font-weight: 700; }
    .status.approved { background: #eaf8ee; color: #1e6b3a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginScreen" class="screen active">
      <h2>Admin Sign In</h2>
      <form id="loginForm">
        <div class="field"><label>Email</label><input id="email" type="email" value="admin@spatialvisiontech.in" /></div>
        <div class="field"><label>Password</label><input id="password" type="password" value="Admin@123456" /></div>
        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" style="margin-top:12px; color:red;"></div>
      </form>
    </div>

    <div id="dashboardScreen" class="screen">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;">
        <h2 style="margin:0;">Student Management</h2>
        <button class="btn secondary" type="button" onclick="logout()">Sign out</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Registration</th>
            <th>Finalized Fee</th>
            <th>Fee History</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <script src="storage.js"></script>
  <script>
    let adminLoggedIn = false;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function listStudents() {
      const students = readStudents().filter(student => student.role !== 'admin');
      const tbody = document.getElementById('studentTable');
      tbody.innerHTML = '';

      students.forEach(student => {
        const row = document.createElement('tr');
        const hasPortal = student.grantedAccess === true;
        const approvalTag = student.approvalStatus === 'Approved'
          ? '<span class="status approved">Approved</span>'
          : '<span class="status">Pending</span>';

        row.innerHTML = `
          <td>
            <strong>${student.name}</strong><br>
            <small>${student.email}</small><br>
            <small>${student.studentId}</small>
          </td>
          <td>
            ${approvalTag}<br>
            <small>Payment: ${student.regPaymentStatus || 'Pending'}</small><br>
            <small>UTR: ${student.regUtr || 'Not entered'}</small>
          </td>
          <td>
            ₹${Number(student.finalizedFee || 4900).toLocaleString('en-IN')}
          </td>
          <td>
            ${(student.feeHistory || []).length ? student.feeHistory.map(f => `<div><strong>${f.type}</strong><br><small>₹${Number(f.amount).toLocaleString('en-IN')} | ${f.status}</small></div>`).join('<br>') : '<small>No fee records</small>'}
          </td>
          <td>
            <button class="btn" type="button" onclick="approveStudent('${student.uid}')">Approve</button><br><br>
            <button class="btn ${hasPortal ? 'secondary' : 'warn'}" type="button" onclick="toggleAccess('${student.uid}', ${!hasPortal})">${hasPortal ? 'Revoke Portal' : 'Grant Portal'}</button><br><br>
            <input type="password" id="temp-${student.uid}" placeholder="Temporary password" /><br><br>
            <button class="btn secondary" type="button" onclick="setTempPassword('${student.uid}')">Set Password</button><br><br>
            <button class="btn danger" type="button" onclick="deleteStudent('${student.uid}')">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');

      if (validateAdminLogin(email, password)) {
        adminLoggedIn = true;
        msg.textContent = '';
        switchScreen('dashboardScreen');
        listStudents();
      } else {
        msg.textContent = 'Invalid admin login.';
      }
    });

    window.approveStudent = function(uid) {
      const student = getStudentById(uid);
      if (!student) return;
      const updated = updateStudent(uid, {
        approvalStatus: 'Approved',
        regPaymentStatus: 'Pre-registration Paid',
        preRegistrationPaid: true,
        grantedAccess: student.grantedAccess || false
      });
      if (updated) listStudents();
    };

    window.toggleAccess = function(uid, allowed) {
      updateStudent(uid, { grantedAccess: allowed, accessUpdatedAt: new Date().toISOString() });
      listStudents();
    };

    window.setTempPassword = function(uid) {
      const input = document.getElementById(`temp-${uid}`);
      const pass = input.value;
      if (!pass || pass.length < 8) {
        alert('Temporary password must be at least 8 characters.');
        return;
      }
      const success = setStudentPassword(uid, pass);
      if (success) {
        input.value = '';
        alert('Password updated for this student.');
      }
    };

    window.deleteStudent = function(uid) {
      const remaining = readStudents().filter(student => {
        return student.uid !== uid && student.email?.toLowerCase() !== ADMIN_EMAIL;
      });
      writeStudents(remaining);
      listStudents();
    };

    function logout() {
      adminLoggedIn = false;
      document.getElementById('loginForm').reset();
      document.getElementById('loginMsg').textContent = '';
      switchScreen('loginScreen');
    }
  </script>
</body>
</html>
