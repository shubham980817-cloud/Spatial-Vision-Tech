<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Vision Tech | Student Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4faf8; color: #1d2d2e; }
    .wrap { max-width: 980px; margin: 60px auto; background: #fff; padding: 30px; border: 1px solid #dfeae7; box-shadow: 0 12px 28px rgba(0,0,0,.07); }
    .screen { display: none; }
    .screen.active { display: block; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #cddbd7; }
    .btn { display: inline-block; background: #00b482; color: #051a1d; border: none; padding: 12px 20px; font-weight: 700; cursor: pointer; }
    .btn.secondary { background: #0d4a5d; color: #fff; }
    .muted { color: #555; }
    .box { background: #f7f9fa; border: 1px solid #dfe7eb; padding: 20px; margin-top: 18px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #dfe7eb; padding: 10px; text-align: left; }
    th { background: #0b1f25; color: #fff; }
    .receipt-item { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginScreen" class="screen active">
      <h2>Student Sign In</h2>
      <form id="loginForm">
        <div class="field"><label>Email</label><input id="email" type="email" required /></div>
        <div class="field"><label>Password</label><input id="password" type="password" required /></div>
        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" class="muted" style="margin-top:10px;"></div>
      </form>
      <p><a href="register.html">Need to register?</a> | <a href="admin.html">Admin login</a></p>
    </div>

    <div id="pendingScreen" class="screen">
      <h2>Portal access pending</h2>
      <p class="muted">Your profile is submitted and waiting for admin approval.</p>
      <button class="btn secondary" type="button" onclick="logout()">Sign out</button>
    </div>

    <div id="dashboardScreen" class="screen">
      <h2>Welcome, <span id="d-name"></span></h2>
      <p><strong>Student ID:</strong> <span id="d-student-id"></span></p>

      <div class="box">
        <h3>Pay course fees</h3>
        <form id="feeForm">
          <div class="field">
            <label>Select Installment</label>
            <select id="feeType">
              <option value="">Choose fee type...</option>
              <option value="Final Registration Fee (₹4,900)" data-amount="4900">Final Registration Fee (₹4,900)</option>
              <option value="1st Installment (₹10,000)" data-amount="10000">1st Installment (₹10,000)</option>
              <option value="2nd Installment (₹10,000)" data-amount="10000">2nd Installment (₹10,000)</option>
              <option value="3rd Installment (₹10,000)" data-amount="10000">3rd Installment (₹10,000)</option>
              <option value="Additional Installment (₹5,000)" data-amount="5000">Additional Installment (₹5,000)</option>
            </select>
          </div>
          <div class="field"><label>UPI Transaction ID / UTR</label><input id="feeUtr" required /></div>
          <button id="feeSubmitBtn" class="btn" type="submit" disabled>Choose an Installment</button>
        </form>
      </div>

      <div class="box">
        <h3>Previous receipts</h3>
        <div id="receiptList"></div>
      </div>

      <div style="margin-top:20px;">
        <button class="btn secondary" type="button" onclick="logout()">Sign out</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script>
    let currentStudent = null;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function saveCurrentStudent() {
      const students = readStudents();
      const index = students.findIndex(item => item.uid === currentStudent.uid);
      if (index >= 0) {
        students[index] = currentStudent;
        writeStudents(students);
      }
    }

    function renderReceiptList() {
      const list = document.getElementById('receiptList');
      const history = currentStudent && currentStudent.feeHistory ? currentStudent.feeHistory : [];
      if (!history.length) {
        list.innerHTML = '<p class="muted">No previous receipts available.</p>';
        return;
      }

      list.innerHTML = history.slice().reverse().map(record => `
        <div class="receipt-item">
          <strong>${record.type}</strong><br>
          <span class="muted">${new Date(record.date).toLocaleDateString('en-IN')} | ${record.status}</span><br>
          <span>₹${Number(record.amount).toLocaleString('en-IN')}</span>
        </div>
      `).join('');
    }

    function updateFeeButton() {
      const select = document.getElementById('feeType');
      const button = document.getElementById('feeSubmitBtn');
      const amount = Number(select.selectedOptions[0]?.dataset.amount || 0);
      button.disabled = !amount;
      button.textContent = amount ? `Pay ₹${amount.toLocaleString('en-IN')} Installment` : 'Choose an Installment';
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const student = getStudentByEmail(email);
      const msg = document.getElementById('loginMsg');

      if (!student || student.password !== password || student.role !== 'student') {
        msg.textContent = 'Invalid student email or password.';
        msg.style.color = 'red';
        return;
      }

      currentStudent = student;
      if (currentStudent.grantedAccess !== true) {
        switchScreen('pendingScreen');
      } else {
        document.getElementById('d-name').textContent = currentStudent.name;
        document.getElementById('d-student-id').textContent = currentStudent.studentId;
        renderReceiptList();
        switchScreen('dashboardScreen');
      }
    });

    document.getElementById('feeType').addEventListener('change', updateFeeButton);

    document.getElementById('feeForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const select = document.getElementById('feeType');
      const utr = document.getElementById('feeUtr').value.trim();
      const amount = Number(select.selectedOptions[0]?.dataset.amount || 0);
      const type = select.value;

      if (!type || !amount || !utr) {
        return;
      }

      const student = getStudentByEmail(currentStudent.email);
      if (!student) return;

      const record = {
        type,
        amount: String(amount),
        utr,
        status: 'Submitted - Pending Verification',
        date: new Date().toISOString()
      };

      student.feeHistory = [...(student.feeHistory || []), record];
      saveStudent(student);
      currentStudent = student;
      document.getElementById('feeForm').reset();
      updateFeeButton();
      renderReceiptList();
      alert('Payment submitted successfully.');
    });

    function logout() {
      currentStudent = null;
      document.getElementById('loginForm').reset();
      document.getElementById('loginMsg').textContent = '';
      switchScreen('loginScreen');
    }

    updateFeeButton();
  </script>
</body>
</html>
